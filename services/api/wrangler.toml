name = "theteacher-api"
main = "src/index.ts"
compatibility_date = "2024-11-17"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "theteacher-db"
database_id = "theteacher-db"

[[r2_buckets]]
binding = "MATERIALS_BUCKET"
bucket_name = "theteacher-materials"

[[kv_namespaces]]
binding = "MATERIALS_KV"
id = "theteacher-materials-kv"

[[vectorize]]
binding = "VECTORIZE"
index_name = "theteacher-semantic"

[vars]
# Set this to your Google OAuth client ID to enable Google Sign-In
GOOGLE_CLIENT_ID = ""
VECTORIZE_INDEX_DIMENSIONS = "1536"
