name = "theteacher-api"
main = "src/index.ts"
compatibility_date = "2024-11-17"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "theteacher-db"
database_id = "theteacher-db"

[[r2_buckets]]
binding = "MATERIALS_BUCKET"
bucket_name = "theteacher-materials"

[[kv_namespaces]]
binding = "MATERIALS_KV"
id = "theteacher-materials-kv"

[vars]
# Set this to your Google OAuth client ID to enable Google Sign-In
GOOGLE_CLIENT_ID = ""
STRIPE_SECRET_KEY = ""
STRIPE_PRICE_ID = ""
STRIPE_WEBHOOK_SECRET = ""
STRIPE_PRICE_CURRENCY = "jpy"
STRIPE_PRICE_AMOUNT = "1200"
CREDITS_PER_PACK = "120"
MIN_PRICE_PER_CREDIT = "12"
