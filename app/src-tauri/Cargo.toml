[package]
name = "theteacher-app"
version = "0.1.0"
description = "Tauri shell for TheTeacher SolidJS client"
authors = ["TheTeacher"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.7", features = [] }

[dependencies]
tauri = { version = "1.7", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
